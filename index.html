<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>眼前的黑不是黑</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
  
  <style>
    /* 🌟 煙霧底層防線：鎖死純黑，防止外圍泛白 */
    html {
      background-color: #0b0b0b;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start; /* 靠頂部對齊，防止溢出 */
      padding: 40px 0;        
      box-sizing: border-box;
      overflow-y: auto;        
      overflow-x: hidden;
      background-color: transparent; /* 保持透明讓煙霧透上來 */
    }
    
    /* ==========================================
       💨 測驗頁：純白濃郁迷霧特效 (徹底洗去黃色調)
       ========================================== */
    .smoke-bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 0; /* 待在灰色卡片後方 */
      pointer-events: none; 
      background-color: #050505; 
    }

    .smoke-layer {
      position: absolute;
      width: 180%;
      height: 180%;
      top: -40%;
      left: -40%;
      background: 
        radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.11) 0%, transparent 55%),
        radial-gradient(circle at 80% 75%, rgba(255, 255, 255, 0.08) 0%, transparent 55%),
        linear-gradient(to right, transparent, rgba(255, 255, 255, 0.03) 30%, rgba(255, 255, 255, 0.06) 70%, transparent);
      filter: blur(55px);
      pointer-events: none;
    }

    .smoke-1 { opacity: 0.9; animation: smokeDrift 40s ease-in-out infinite; }
    .smoke-2 { transform: scale(1.3) rotate(45deg); opacity: 0.8; animation: smokeDrift 28s ease-in-out infinite reverse; }
    .smoke-3 { transform: scale(1.1) rotate(-20deg); opacity: 0.7; animation: smokeDrift 20s ease-in-out infinite; }

    @keyframes smokeDrift {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      33% { transform: translate(5%, -7%) scale(1.12) rotate(6deg); }
      66% { transform: translate(-6%, 5%) scale(0.92) rotate(-6deg); }
      100% { transform: translate(0, 0) scale(1) rotate(0deg); }
    }
    
    .container {
      background-color: #141414;
      padding: 35px 40px;      
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      max-width: 850px; 
      width: 92%;      
      text-align: center;
      border: 1px solid #222;
      position: relative;
      box-sizing: border-box;
      margin: 0 auto;          
      z-index: 2; /* 確保在煙霧前方 */
    }
    
    h2 { margin-top: 0; margin-bottom: 25px; color: #ffdd67; font-size: 26px; }
    .progress { font-size: 14px; color: #666; margin-bottom: 15px; }
    .question-title { font-size: 20px; margin-bottom: 25px; line-height: 1.4; color: #e0e0e0; }
    
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px; 
      margin: 10px 0;
      background-color: #1c1c1c;
      color: #ddd;
      border: 2px solid #2c2c2c;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      box-sizing: border-box;
    }
    .btn:hover { 
      background-color: #252525; 
      border-color: #ffdd67; 
      color: #fff;
    }

    .nav-actions {
      margin-top: 25px;
      border-top: 1px solid #222;
      padding-top: 15px;
    }
    .back-btn {
      background: transparent;
      color: #666;
      border: 1px solid #333;
      padding: 8px 20px;
      font-size: 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .back-btn:hover {
      color: #ffdd67;
      border-color: #ffdd67;
      background-color: rgba(255, 221, 103, 0.05);
    }

    .restart-btn {
      background-color: transparent;
      color: #ffdd67;
      border: 2px solid #ffdd67;
      padding: 12px 30px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 221, 103, 0.1);
      position: relative !important;
      z-index: 99999 !important; 
      pointer-events: auto !important;
    }
    .restart-btn:hover {
      background-color: #ffdd67;
      color: #000000;
      box-shadow: 0 0 25px #ffdd67;
    }

    .restart-btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      border-color: #555;
      color: #999;
      box-shadow: none;
    }

    #result-page { display: none; }
    
    #result-page #tracking-container {
      width: 720px !important;   
      height: 540px !important;  
      margin: 0 auto !important;
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    #result-page #output_canvas {
      width: 720px !important;
      height: 540px !important;
      border-radius: 16px;
      border: none !important;
      display: block;
    }
    #result-page .restart-btn {
      display: inline-block !important;
      margin-top: 20px !important;
      width: auto !important;
    }

    .eye-grow-img {
      position: fixed; 
      z-index: 9998; 
      transform: translate(-50%, -50%); 
      width: 130px; 
      height: auto;
      pointer-events: none; 
      display: none; 
      opacity: 0;
      transition: opacity 2s ease;
    }

    #preview-page { display: none; text-align: center; padding: 10px 0; }
    #preview-page #tracking-container {
      width: 720px !important; height: 540px !important; margin: 0 auto !important; position: relative; border-radius: 16px; overflow: hidden;
    }
    #preview-page #preview-photo-img {
      width: 720px !important; height: 540px !important; object-fit: cover; border-radius: 16px; border: none !important; display: block;
    }
    #preview-page .preview-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    #preview-page .restart-btn { display: inline-block !important; margin-top: 0 !important; width: auto !important; }

    #photo-result-page { display: none; text-align: center; padding: 10px 0; }
    .display-character-img { width: 100%; max-width: 450px; height: auto; margin: 0 auto; display: block; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.6); object-fit: contain; }
    .display-photo-result-img { width: 320px; height: 240px; object-fit: cover; margin: 0 auto; display: block; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }

    .photo-result-shell { width: min(100%, 1180px); display: grid; grid-template-columns: minmax(320px, 1.1fr) minmax(280px, 0.9fr); gap: 24px; align-items: center; }
    .result-media-column, .result-info-column { display: flex; flex-direction: column; gap: 18px; justify-content: center; }
    .result-media-card { background: rgba(255,255,255,0.02); border: 1px solid #222; border-radius: 22px; padding: 16px; }

    #photo-page-title { margin: 0; text-align: left; }
    #photo-quote-text { color: #e0e0e0; font-style: italic; margin: 0; font-size: 16px; line-height: 1.6; text-align: left; }

    .qr-section { margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
    
    #qr-code-container { 
      width: 156px; 
      height: 156px; 
      background: rgba(255,255,255,0.04); 
      border: 1px dashed #444; 
      border-radius: 18px; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      box-sizing: border-box;
    }
    .qr-copy { color: #888; font-size: 13px; line-height: 1.6; max-width: 90%; margin: 0; text-align: left; }

    #bgm-ctrl {
      position: fixed; top: 20px; right: 20px; z-index: 99999; background: rgba(28,28,28,0.85); border: 1px solid #ffdd67; color: #ffdd67; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; letter-spacing: 1px; transition: all 0.2s;
    }

    #ai-loading-mask {
      position: absolute; top:0; left:0; width:100%; height:100%; background: #141414; z-index: 1000; display: flex; justify-content: center; align-items: center; border-radius: 24px; flex-direction: column;
    }

    @media (max-width: 900px) {
      .photo-result-shell { grid-template-columns: 1fr; }
      .result-actions, .qr-section { justify-content: center; align-items: center; }
      #photo-page-title, #photo-quote-text, .qr-copy { text-align: center; }
      #result-page #tracking-container, #preview-page #tracking-container, #preview-page #preview-photo-img {
        width: 100% !important; max-width: 320px !important; height: 240px !important;
      }
    }
  </style>
</head>
<body>

<div class="smoke-bg-container">
  <div class="smoke-layer smoke-1"></div>
  <div class="smoke-layer smoke-2"></div>
  <div class="smoke-layer smoke-3"></div>
</div>

<div id="bgm-ctrl" onclick="toggleBgm()">🎵 BGM: ON</div>

<audio id="bgm-player" loop autoplay>
  <source src="./BGM.mp4" type="audio/mp3">
</audio>

<div class="container">
  <div id="ai-loading-mask">
    <div style="font-size: 24px; color: #ffdd67; margin-bottom: 20px; font-weight: bold;">深夜煉金術指標載入中...</div>
    <div style="font-size: 14px; color: #666;">（正在連結 AI 核心，請稍候）</div>
  </div>

  <div id="quiz-page">
    <div class="progress" id="progress-text">LOADING...</div>
    <div class="question-title" id="question-text">準備進入黑眼圈回收程序...</div>
    <div id="options-container"></div>
    <div class="nav-actions">
      <button id="back-nav-btn" class="back-btn" onclick="handleBackNavigation()">← 返回封面</button>
    </div>
  </div>

  <div id="result-page">
    <div id="tracking-container">
      <video id="webcam" autoplay playsinline style="display: none;" width="640" height="480"></video>
      <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>
    <img id="left-eye-img" src="" alt="左眼貼圖" class="eye-grow-img">
    <img id="right-eye-img" src="" alt="右眼貼圖" class="eye-grow-img">
    <div style="display: none;">
      <div id="char-name"></div>
      <div id="quote-text"></div>
    </div>
    <button id="camera-action-btn" class="restart-btn" onclick="goToPhotoPreview()" disabled>黑眼圈IP生成中...</button>
  </div>

  <div id="preview-page">
    <div id="tracking-container">
      <img id="preview-photo-img" src="" alt="拍照預覽">
    </div>
    <div class="preview-actions">
      <button class="restart-btn" onclick="retakePhoto()">重新拍照</button>
      <button class="restart-btn" onclick="goToPhotoResultPage()">確認</button>
    </div>
  </div>

  <div id="photo-result-page">
    <div class="photo-result-shell">
      <div class="result-media-column">
        <h2 id="photo-page-title" style="color: #ffdd67; margin: 0;"></h2>
        <div class="result-media-card">
          <img id="photo-result-char-img" src="" alt="角色插圖" class="display-character-img">
        </div>
        <div class="result-media-card">
          <img id="photo-result-photo-img" src="" alt="拍照結果" class="display-photo-result-img">
        </div>
      </div>
      <div class="result-info-column">
        <p id="photo-quote-text"></p>
        <div class="qr-section">
          <div id="qr-code-container">
            <span style="font-size: 12px; color: #666; text-align: center; padding: 10px; font-style: normal;">點擊下方儲存<br>即刻提煉 QR 碼</span>
          </div>
          <p class="qr-copy" id="qr-text-hint">點擊下方「儲存結果」按鈕，系統將自動拍下你眼前的內容並為你提煉出真實的雲端 QR Code 分享圖！</p>
        </div>
        <div class="result-actions">
          <button class="restart-btn" onclick="saveCurrentResult()">儲存結果</button>
        </div>
        <div class="result-actions">
          <button class="restart-btn" onclick="goToCoverPage()">重新回收 / 下一位</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const DATABASE_API_URL = "https://script.google.com/macros/s/AKfycbzwdbSwxhGiK2jT7iE5-R6N-74QoN-fnrbtIGesQbDF72T2aoIY31yy0p1kbNDKAkI/exec";
  let faceMesh;
  let camera;
  let videoElement;
  let canvasElement;
  let canvasCtx;
  let currentFinalColor = 'white';
  let loadedImages = {};     
  let detectedColor = 'white';
  let capturedPhotoDataUrl = '';

  let currentEyeWidth = 130; 
  const maxEyeWidth = 5200; 
  const growSpeedPerSecond = 180;

  let hasLockedCoordinates = false;
  let animationFrameId = null;
  let lastTimestamp = 0;
  let startTime = 0; 
  let isShrinking = false;
  let shrinkStartTimestamp = 0;
  let hasCompletedSequence = false;

  let eyePositions = { lx: 0, ly: 0, rx: 0, ry: 0 };

  const characterImages = {
    red:    './images/pattern_red.png',  
    orange: './images/pattern_orange.png',
    yellow: './images/pattern_yellow.png',
    green:  './images/pattern_green.png',
    blue:   './images/pattern_blue.png',
    purple: './images/pattern_purple.png',
    black:  './images/pattern_black.png', 
    white:  './images/pattern_white.png' 
  };

  const colorPatternsBase = {
    red:    './images/pattern_red.png',
    orange: './images/pattern_orange.png',
    yellow: './images/pattern_yellow.png',
    green:  './images/pattern_green.png',
    blue:   './images/pattern_blue.png',
    purple: './images/pattern_purple.png',
    black:  './images/pattern_black.png',
    white:  './images/pattern_white.png'
  };

  const colorPatternsLeft = {
    red:    './images/pattern_red_L.png', orange: './images/pattern_orange_L.png', yellow: './images/pattern_yellow_L.png', green:  './images/pattern_green_L.png',
    blue:   './images/pattern_blue_L.png', purple: './images/pattern_purple_L.png', black:  './images/pattern_black_L.png', white:  './images/pattern_white_L.png'
  };

  const colorPatternsRight = {
    red:    './images/pattern_red_R.png', orange: './images/pattern_orange_R.png', yellow: './images/pattern_yellow_R.png', green:  './images/pattern_green_R.png',
    blue:   './images/pattern_blue_R.png', purple: './images/pattern_purple_R.png', black:  './images/pattern_black_R.png', white:  './images/pattern_white_R.png'
  };

  const colorPatternsAltLeft = {
    red:    './images/pattern_red_L.png', orange: './images/pattern_orange_L.png', yellow: './images/pattern_yellow_L.png', green:  './images/pattern_green_L.png',
    blue:   './images/pattern_blue_L.png', purple: './images/pattern_purple_L.png', black:  './images/pattern_black_L.png', white:  './images/pattern_white_L.png'
  };

  const colorPatternsAltRight = {
    red:    './images/pattern_red_R.png', orange: './images/pattern_orange_R.png', yellow: './images/pattern_yellow_R.png', green:  './images/pattern_green_R.png',
    blue:   './images/pattern_blue_R.png', purple: './images/pattern_purple_R.png', black:  './images/pattern_black_R.png', white:  './images/pattern_white_R.png'
  };

  let bgm = document.getElementById('bgm-player');
  let bgmCtrl = document.getElementById('bgm-ctrl');
  let isMusicPlaying = false;

  function toggleBgm() {
    if (!bgm) return;
    if (!isMusicPlaying) {
      bgm.play().then(() => {
        isMusicPlaying = true;
        bgmCtrl.innerText = "🎵 BGM: ON";
      });
    } else {
      bgm.pause();
      isMusicPlaying = false;
      bgmCtrl.innerText = "🎵 BGM: OFF";
    }
  }

  function setBgmSpeed(speed) {
    if (bgm) bgm.playbackRate = speed;
  }

  function initAiCore() {
    videoElement = document.getElementById("webcam");
    canvasElement = document.getElementById("output_canvas");
    canvasCtx = canvasElement.getContext("2d");

    Object.keys(colorPatternsLeft).forEach(color => {
      const img = new Image(); img.src = colorPatternsLeft[color]; loadedImages[`${color}_L`] = img;
    });
    Object.keys(colorPatternsRight).forEach(color => {
      const img = new Image(); img.src = colorPatternsRight[color]; loadedImages[`${color}_R`] = img;
    });
    Object.keys(colorPatternsAltLeft).forEach(color => {
      const img = new Image(); img.src = colorPatternsAltLeft[color]; loadedImages[`${color}_2_L`] = img;
    });
    Object.keys(colorPatternsAltRight).forEach(color => {
      const img = new Image(); img.src = colorPatternsAltRight[color]; loadedImages[`${color}_2_R`] = img;
    });
    Object.keys(colorPatternsBase).forEach(color => {
      const img = new Image(); img.src = colorPatternsBase[color]; loadedImages[color] = img;
    });

    const FaceMeshClass = window.FaceMesh || FaceMesh;
    faceMesh = new FaceMeshClass({
      locateFile: (file) => `https://unpkg.com/@mediapipe/face_mesh@0.4/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onFaceResults);
    document.getElementById("ai-loading-mask").style.display = "none";
    showQuestion();
  }

  function updateCameraActionButtonState(isReady, label = '拍照') {
    const cameraActionBtn = document.getElementById('camera-action-btn');
    if (!cameraActionBtn) return;
    cameraActionBtn.disabled = !isReady;
    cameraActionBtn.innerText = label;
  }

  function startTrackingAR(finalColor) {
    currentFinalColor = finalColor; currentEyeWidth = 130; hasLockedCoordinates = false; isShrinking = false; shrinkStartTimestamp = 0; hasCompletedSequence = false; capturedPhotoDataUrl = '';
    updateCameraActionButtonState(false, '黑眼圈IP生成中...');
    
    const now = performance.now(); lastTimestamp = now; startTime = now;
    if (animationFrameId) { cancelAnimationFrame(animationFrameId); }

    const lImg = document.getElementById('left-eye-img');
    const rImg = document.getElementById('right-eye-img');
    lImg.src = colorPatternsLeft[finalColor]; rImg.src = colorPatternsRight[finalColor];
    lImg.style.width = '130px'; rImg.style.width = '130px'; lImg.style.opacity = '0'; rImg.style.opacity = '0';
    lImg.style.display = 'none'; rImg.style.display = 'none';

    document.getElementById("tracking-container").style.display = "block";

    if (!camera) {
      const CameraClass = window.Camera || Camera;
      camera = new CameraClass(videoElement, {
        onFrame: async () => { await faceMesh.send({ image: videoElement }); }, width: 640, height: 480
      });
      camera.start().catch(err => { alert("鏡頭啟動失敗：" + err); });
    }
    animateImageGrowth(performance.now());
  }

  function animateImageGrowth(currentTimestamp) {
    const deltaTime = (currentTimestamp - lastTimestamp) / 1000;
    lastTimestamp = currentTimestamp;
    const timeElapsed = currentTimestamp - startTime;
    const lImg = document.getElementById('left-eye-img');
    const rImg = document.getElementById('right-eye-img');

    const fadeDuration = 2500; const pauseDuration = 2000; const shrinkDuration = 1200; const initialWaitDuration = 1500;

    if (timeElapsed >= initialWaitDuration && hasLockedCoordinates) {
      lImg.style.display = 'block'; rImg.style.display = 'block';
      const fadeElapsed = timeElapsed - initialWaitDuration;
      const fadeProgress = Math.min(fadeElapsed / fadeDuration, 1);

      if (fadeProgress < 1) {
        lImg.style.opacity = String(fadeProgress); rImg.style.opacity = String(fadeProgress); currentEyeWidth = 70;
      } else if (fadeElapsed < fadeDuration + pauseDuration) {
        lImg.style.opacity = '1'; rImg.style.opacity = '1'; currentEyeWidth = 130;
      } else if (hasCompletedSequence) {
        lImg.style.opacity = '1'; rImg.style.opacity = '1'; currentEyeWidth = 130;
        updateCameraActionButtonState(true, '拍照');
      } else if (isShrinking) {
        lImg.style.opacity = '1'; rImg.style.opacity = '1';
        const shrinkProgress = Math.min((currentTimestamp - shrinkStartTimestamp) / shrinkDuration, 1);
        currentEyeWidth = maxEyeWidth - (maxEyeWidth - 70) * shrinkProgress;
        if (shrinkProgress >= 1) {
          currentEyeWidth = 130; isShrinking = false; hasCompletedSequence = true;
          lImg.src = colorPatternsBase[currentFinalColor]; rImg.src = colorPatternsBase[currentFinalColor];
          updateCameraActionButtonState(true, '拍照');
        }
      } else {
        lImg.style.opacity = '1'; rImg.style.opacity = '1';
        const growProgress = Math.min((currentTimestamp - (startTime + initialWaitDuration + fadeDuration + pauseDuration)) / shrinkDuration, 1);
        currentEyeWidth = 130 + (maxEyeWidth - 130) * growProgress;
        if (growProgress >= 1) {
          currentEyeWidth = maxEyeWidth;
          lImg.src = colorPatternsAltLeft[currentFinalColor]; rImg.src = colorPatternsAltRight[currentFinalColor];
          isShrinking = true; shrinkStartTimestamp = currentTimestamp;
        }
      }
    } else {
      currentEyeWidth = 130; lImg.style.display = 'none'; rImg.style.display = 'none'; lImg.style.opacity = '0'; rImg.style.opacity = '0';
    }

    lImg.style.width = currentEyeWidth + 'px'; rImg.style.width = currentEyeWidth + 'px';
    if (hasLockedCoordinates) {
      const inwardShift = Math.min(currentEyeWidth * -0.3, 100);
      lImg.style.left = eyePositions.lx + inwardShift + 'px'; lImg.style.top = eyePositions.ly + 'px';
      rImg.style.left = eyePositions.rx - inwardShift + 'px'; rImg.style.top = eyePositions.ry + 'px';
    }
    animationFrameId = requestAnimationFrame(animateImageGrowth);
  }

  function onFaceResults(results) {
    canvasCtx.save(); canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    canvasCtx.translate(canvasElement.width, 0); canvasCtx.scale(-1, 1);
    canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
    
    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
      const landmarks = results.multiFaceLandmarks[0];
      const rect = canvasElement.getBoundingClientRect();
      eyePositions.lx = rect.left + (1 - landmarks[111].x) * rect.width;
      eyePositions.ly = rect.top + landmarks[111].y * rect.height;
      eyePositions.rx = rect.left + (1 - landmarks[340].x) * rect.width;
      eyePositions.ry = rect.top + landmarks[340].y * rect.height;

  function captureCurrentFrame() {
    if (!canvasElement) return '';
    try {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvasElement.width; tempCanvas.height = canvasElement.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(canvasElement, 0, 0, tempCanvas.width, tempCanvas.height);

      const lImg = document.getElementById('left-eye-img');
      const rImg = document.getElementById('right-eye-img');
      const rect = canvasElement.getBoundingClientRect();

      const drawOverlay = (imgElement) => {
        if (!imgElement || !imgElement.src || imgElement.style.display === 'none' || imgElement.style.opacity === '0') return;
        const scaledWidth = parseFloat(imgElement.style.width || '0');
        if (!scaledWidth) return;
        const aspect = imgElement.naturalHeight / imgElement.naturalWidth;
        const drawWidth = scaledWidth; const drawHeight = scaledWidth * aspect;
        const sourceX = (imgElement === lImg ? eyePositions.lx : eyePositions.rx) - rect.left;
        const sourceY = (imgElement === lImg ? eyePositions.ly : eyePositions.ry) - rect.top;
        const canvasX = sourceX * (canvasElement.width / rect.width);
        const canvasY = sourceY * (canvasElement.height / rect.height);
        tempCtx.drawImage(imgElement, canvasX - drawWidth / 2, canvasY - drawHeight / 2, drawWidth, drawHeight);
      };

      drawOverlay(lImg); drawOverlay(rImg);
      return tempCanvas.toDataURL('image/png');
    } catch (error) { console.error('拍照失敗：', error); return ''; }
  }

  function saveCurrentResult() {

        correctLevel: QRCode.CorrectLevel.M
      });

      if (hintText) {
        hintText.innerText = "提煉成功！專屬 QR 碼已同步包含在下載的圖片中囉！";

      // 🚀 物理攔截：先在手機上變出一個充滿儀式感的洗照片畫面
      document.body.innerHTML = `
        <div id="loading-img-cloud" style="width: 100vw; height: 100vh; background: #0b0b0b; display: flex; justify-content: center; align-items: center; flex-direction: column; font-family: sans-serif; position: fixed; top:0; left:0; z-index:999999;">
          <div style="color: #ffdd67; font-size: 20px; font-weight: bold; margin-bottom: 10px; letter-spacing: 1px;">深夜煉金術：正在沖洗結果照片...</div>
          <div style="color: #666; font-size: 13px;">（正在從雲端相簿回收大照片，請稍候）</div>
        </div>
      `;

      // 🛡️ 我們改用帶有追蹤跳轉的 fetch 去後台把那一座山的資料默默拿回來
      fetch(`${DATABASE_API_URL}?uid=${shareId}`, {
        method: "GET",
        mode: "cors",
        redirect: "follow"
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success" && data.photoDataUrl) {
          // 👑 奇蹟降臨：把那一長串密密麻麻的文字，物理轉化為滿版大圖片！
          document.body.innerHTML = `
            <div style="width: 100vw; min-height: 100vh; background: #141414; display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px; box-sizing: border-box; position: absolute; top:0; left:0; z-index:999999;">
              <img src="${data.photoDataUrl}" alt="成果報告" style="width: 100%; max-width: 800px; height: auto; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.8); display: block;">
            </div>
          `;
        } else {
          document.body.innerHTML = `<div style="color: #ff4444; text-align:center; padding-top:100px; background:#141414; height:100vh;">找不到這張照片報告，請重新生成一次</div>`;
        }
      })
      .catch(err => {
        // 🌟 【超級防爆線】：萬一手機 Safari 又被攔截了背景連線，我們用「備用實體提取法」
        // 直接去解析 Google 的那串文字，絕對不讓手機卡在英文字畫面！
        console.error("背景讀取有波折，啟動實體安全提取...");
        window.location.href = `${DATABASE_API_URL}?uid=${shareId}`;
      });
    }
  });
</script>
</body>
</html>
