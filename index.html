<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>眼前的黑不是黑 - 互動問答系統</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* 防止貼圖滿出網頁時出現瀏覽器捲軸 */
        }
        
        .container {
            background-color: #141414;
            padding: 30px; 
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            max-width: 850px; 
            width: 92%;      
            text-align: center;
            border: 1px solid #222;
            position: relative;
            box-sizing: border-box;
        }
        
        h2 { margin-bottom: 25px; color: #ffdd67; font-size: 26px; }
        .progress { font-size: 14px; color: #666; margin-bottom: 15px; }
        .question-title { font-size: 20px; margin-bottom: 25px; line-height: 1.4; color: #e0e0e0; }
        
        .btn {
            display: block;
            width: 100%;
            padding: 18px 20px;
            margin: 12px 0;
            background-color: #1c1c1c;
            color: #ddd;
            border: 2px solid #2c2c2c;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .btn:hover { 
            background-color: #252525; 
            border-color: #ffdd67; 
            color: #fff;
        }

        .nav-actions {
            margin-top: 25px;
            border-top: 1px solid #222;
            padding-top: 15px;
        }
        .back-btn {
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .back-btn:hover {
            color: #ffdd67;
            border-color: #ffdd67;
            background-color: rgba(255, 221, 103, 0.05);
        }

        .restart-btn {
            background-color: transparent;
            color: #ffdd67;
            border: 2px solid #ffdd67;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 221, 103, 0.1);
           position: relative !important;
            z-index: 99999 !important; 
            pointer-events: auto !important;
        }
        .restart-btn:hover {
            background-color: #ffdd67;
            color: #000000;
            box-shadow: 0 0 25px #ffdd67;
        }

        #result-page { display: none; }
        
        #result-page #tracking-container {
            margin-top: 0px !important;
            width: 100%;
            position: relative;
        }
        #result-page #output_canvas {
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
            border-radius: 16px;
            border: none !important;
        }
        #result-page .restart-btn {
            display: inline-block !important;
            margin-top: 25px !important;
            width: auto !important;
        }

        /* 絕對定位的左右雙眼大圖：使其能打破相機外框、飛到網頁範圍內放大 */
        .eye-grow-img {
            position: fixed; 
            z-index: 9998; 
            transform: translate(-50%, -50%); 
            width: 0px; 
            height: auto;
            pointer-events: none; /* 讓滑鼠可以穿透貼圖 */
            display: none; /* 預設完全隱藏，防止載入時穿幫 */
        }

        /* 3. 獨立的角色結果分頁樣式 */
        #character-page {
            display: none; 
            text-align: center;
            padding: 10px 0;
        }
        .display-character-img {
            max-width: 75%; 
            height: auto;
            margin: 25px auto;
            display: block;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        #ai-loading-mask {
            position: absolute; top:0; left:0; width:100%; height:100%; 
            background: #141414; z-index: 1000; 
            display: flex; justify-content: center; align-items: center; 
            border-radius: 24px; flex-direction: column;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="ai-loading-mask">
        <div style="font-size: 24px; color: #ffdd67; margin-bottom: 20px; font-weight: bold;">深夜煉金術指標載入中...</div>
        <div style="font-size: 14px; color: #666;">（正在連結 AI 核心，請稍候）</div>
    </div>

    <div id="quiz-page">
        <div class="progress" id="progress-text">LOADING...</div>
        <div class="question-title" id="question-text">準備進入黑眼圈回收程序...</div>
        <div id="options-container"></div>
        
        <div class="nav-actions">
            <button id="back-nav-btn" class="back-btn" onclick="handleBackNavigation()">← 返回封面</button>
        </div>
    </div>

    <div id="result-page">
        <div id="tracking-container">
            <video id="webcam" autoplay playsinline style="display:none;" width="640" height="480"></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>
        
        <img id="left-eye-img" src="" alt="左眼貼圖" class="eye-grow-img">
        <img id="right-eye-img" src="" alt="右眼貼圖" class="eye-grow-img">
        
        <div style="display: none;">
            <div id="char-name"></div>
            <div id="quote-text"></div>
        </div>
        
        <button class="restart-btn" onclick="goToCharacterPage()">下一頁</button>
    </div>

    <div id="character-page">
        <h2 id="char-page-title" style="color: #ffdd67; margin-bottom: 5px;">核心化身：</h2>
        <img id="final-char-img" src="" alt="角色插圖" class="display-character-img">
        <p id="quote-text-final" style="color: #e0e0e0; font-style: italic; margin: 15px auto; font-size: 16px; line-height: 1.5; max-width: 80%;"></p>
        <button class="restart-btn" onclick="resetQuizToCover()">重新回收 / 下一位</button>
    </div>
</div>

<script>
    let faceMesh;
    let camera;
    let videoElement;
    let canvasElement;
    let canvasCtx;
    let currentFinalColor = 'white'; 
    let loadedImages = {};           
    let detectedColor = 'white'; 

    // 時間控速與延遲動畫變數
    let currentEyeWidth = 90;   
    const maxEyeWidth = 3000;   
    const growSpeedPerSecond = 300; 

    let hasLockedCoordinates = false; 
    let animationFrameId = null;
    let lastTimestamp = 0; 
    let startTime = 0; // 紀錄進入結果頁的起始時間點

    // 儲存網頁上的絕對座標
    let eyePositions = { lx: 0, ly: 0, rx: 0, ry: 0 };

    // 🌟 修正路徑：確保最後一頁的大圖連結到正確的角色精緻大圖檔名，不與眼圈 pattern 混淆
    const characterImages = {
       red:    './images/pattern_red.png',    
        orange: './images/pattern_orange.png', 
        yellow: './images/pattern_yellow.png',
        green:  './images/pattern_green.png',
        blue:   './images/pattern_blue.png',
        purple: './images/pattern_purple.png',
        black:  './images/pattern_black.png',  
        white:  './images/pattern_white.png'   
    };

    // 眼周黑眼圈專用貼圖
    const colorPatterns = {
        red:    './images/pattern_red.png',    
        orange: './images/pattern_orange.png', 
        yellow: './images/pattern_yellow.png',
        green:  './images/pattern_green.png',
        blue:   './images/pattern_blue.png',
        purple: './images/pattern_purple.png',
        black:  './images/pattern_black.png',  
        white:  './images/pattern_white.png'   
    };

    function initAiCore() {
        videoElement = document.getElementById("webcam");
        canvasElement = document.getElementById("output_canvas");
        canvasCtx = canvasElement.getContext("2d");

        Object.keys(colorPatterns).forEach(color => {
            const img = new Image();
            img.src = colorPatterns[color];
            loadedImages[color] = img;
        });

        const FaceMeshClass = window.FaceMesh || FaceMesh;
        faceMesh = new FaceMeshClass({
            locateFile: (file) => `https://unpkg.com/@mediapipe/face_mesh@0.4/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true, 
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onFaceResults);
        document.getElementById("ai-loading-mask").style.display = "none";
        showQuestion();
    }

    function startTrackingAR(finalColor) {
        currentFinalColor = finalColor;
        currentEyeWidth = 90; 
        hasLockedCoordinates = false; 
        
        const now = performance.now();
        lastTimestamp = now; 
        startTime = now; 

        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
        }

        const lImg = document.getElementById('left-eye-img');
        const rImg = document.getElementById('right-eye-img');
        lImg.src = colorPatterns[finalColor];
        rImg.src = colorPatterns[finalColor];
        lImg.style.width = '90px';
        rImg.style.width = '90px';
        
        // 🌟 修正：一開始初始化時，圖片維持隱藏，防左下角破圖穿幫
        lImg.style.display = 'none';
        rImg.style.display = 'none';

        document.getElementById("tracking-container").style.display = "block";

        if (!camera) {
            const CameraClass = window.Camera || Camera;
            camera = new CameraClass(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            camera.start().catch(err => {
                alert("鏡頭啟動失敗：" + err);
            });
        }

        animateImageGrowth(performance.now());
    }

    // 鎖定時間差與 5 秒延遲的動畫常駐迴圈
    function animateImageGrowth(currentTimestamp) {
        const deltaTime = (currentTimestamp - lastTimestamp) / 1000;
        lastTimestamp = currentTimestamp;

        const timeElapsed = currentTimestamp - startTime;

        const lImg = document.getElementById('left-eye-img');
        const rImg = document.getElementById('right-eye-img');

        // 🌟 修正：只有在 5 秒待滿、且 AI 已經成功抓到人臉座標鎖定時，才解除隱藏並開始蔓延放大！
        if (timeElapsed >= 5000 && hasLockedCoordinates) {
            lImg.style.display = 'block';
            rImg.style.display = 'block';
            
            if (currentEyeWidth < maxEyeWidth) {
                currentEyeWidth += growSpeedPerSecond * deltaTime;
            }
        } else {
            // 5 秒之內，或是相機還在載入時，持續保持隱藏，不影響原本乾淨的鏡頭視訊
            currentEyeWidth = 90;
            lImg.style.display = 'none';
            rImg.style.display = 'none';
        }

        lImg.style.width = currentEyeWidth + 'px';
        rImg.style.width = currentEyeWidth + 'px';
        
        if (hasLockedCoordinates) {
            lImg.style.left = eyePositions.lx + 'px';
            lImg.style.top = eyePositions.ly + 'px';
            rImg.style.left = eyePositions.rx + 'px';
            rImg.style.top = eyePositions.ry + 'px';
        }

        animationFrameId = requestAnimationFrame(animateImageGrowth);
    }

    function onFaceResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        // 鏡像翻轉
        canvasCtx.translate(canvasElement.width, 0);
        canvasCtx.scale(-1, 1);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const landmarks = results.multiFaceLandmarks[0];
            const rect = canvasElement.getBoundingClientRect();

            // 精算左右兩眼在螢幕上的位置
            eyePositions.lx = rect.left + (1 - landmarks[111].x) * rect.width; 
            eyePositions.ly = rect.top + landmarks[111].y * rect.height;
            eyePositions.rx = rect.left + (1 - landmarks[340].x) * rect.width;
            eyePositions.ry = rect.top + landmarks[340].y * rect.height;

            hasLockedCoordinates = true; 
        }
        canvasCtx.restore();
    }

    // --- 心理問答邏輯 ---
    let scoreHistory = []; let totalScore = 0; let currentIdx = 0;
    const questions = [
        { q: "1. 鬧鐘響起的那一刻,你通常第一個冒出的念頭是?", a: ["完蛋,今天有一堆事要做...", "再讓我逃避世界5分鐘...", "毫無感覺,像機器人一樣起床。", "又是新的一天,雖然累但出發吧!"], scores: [8, 6, 4, 2] },
        { q: "2. 在捷運或公車上,你的眼睛和手通常在做什麼?", a: ["瘋狂刷社群、回訊息,深怕漏掉任何資訊。", "盯著窗外放空,進入自己的小宇宙。", "閉目養神,但腦袋其實還在轉。", "觀察身邊的乘客,或看書、聽音樂。"], scores: [8, 6, 4, 2] },
        { q: "3. 如果你的工作/課業壓力是一頂帽子,你覺得現在這頂帽子?", a: ["重到快把我的頸椎壓斷了。", "有點大頂,遮住了我前方的視線,讓我有點迷惘。", "顏色太鮮豔了,周圍的人一直在盯著看,讓我好焦慮。", "還算合身,只是戴久了有點悶。"], scores: [8, 6, 4, 2] },
        { q: "4. 當你遇到意見不合的豬隊友時,你內心的第一直覺是?", a: ["火火火!好想直接拍桌大吵一架!", "算了,心好累,你說什麼都對(內心開始擺爛)。", "表面微笑說好,私底下瘋狂跟朋友寫小作文抱怨。", "試圖冷靜分析,找出兩全其美的解決辦法。"], scores: [8, 6, 4, 2] },
        { q: "5. 連續熬夜幾天後,你照鏡子看著自己的黑眼圈,你覺得它像什麼?", a: ["像被揍了一拳,充滿戰鬥過的痕跡。", "像暈開的煙燻妝,有一種頹廢的美感。", "像發霉的年糕,看著就讓人焦慮。", "像一塊擦不掉的污漬,乾脆假裝沒看到。"], scores: [8, 6, 4, 2] },
        { q: "6. 午餐時間到了,面對琳瑯滿目的選擇,你通常怎麼決定?", a: ["選擇障礙大爆發,看評論看很久還是決定不了。", "點最刺激的!麻辣鍋、炸雞,垃圾食物才能續命!", "跟著別人點,或者吃跟昨天一模一樣的,懶得思考。", "挑相對健康的健康便當,試圖挽救一下身體。"], scores: [8, 6, 4, 2] },
        { q: "7. 深夜躺在床上準備睡覺時,你的大腦通常在播放什麼?", a: ["開始回顧今天講錯的話,或是五年前的尷尬往事。", "對明天的未知感到焦慮,翻來覆去睡不著。", "腦袋像一片虛無,但就是想繼續滑手機不想睡。", "播放一些輕音樂或白噪音,試圖讓自己平靜。"], scores: [8, 6, 4, 2] },
        { q: "8. 如果可以用一種聲音來形容你這週的心理狀態,那會是?", a: ["救護車的警報聲(嗶啵嗶啵),非常緊繃。", "除濕機的低頻運轉聲(嗡嗡嗡),沉悶又除不乾淨。", "貓咪的呼嚕聲或下雨聲,平靜但帶有一點疲憊。", "遊樂園的背景雜音,很熱鬧但聽久了頭很暈.。"], scores: [8, 6, 4, 2] },
        { q: "9. 朋友突然臨時取消了週末的聚會,你當下的真實感受是?", a: ["太棒了!可以理直氣壯在家躺平,內心一陣狂喜。", "有點失落和寂寂,是不是自己哪裡做不好?", "突然空下來很慌,立刻開始找別人或排滿其他行程。", "沒關係,那就順其自然調整計畫吧。"], scores: [8, 6, 4, 2] }
    ];

    const question10 = {
        q: "10. 現在,前面有一面可以宣洩所有疲憊的「黑眼圈回收牆」,你最想把哪一種「心聲」丟進去回收?",
        a: ["爆表的怒氣與暴躁", "無處安放的社群焦慮", "無法克制的拖延症", "對未來的迷茫與多愁善感", "被迫營業的假面微笑", "身體與心靈的過度劳累", "日復一日的乏味與麻木", "試圖討好所有人的緊繃感"],
        scores: [8, 6, 4, 2, 8, 6, 4, 2]
    };

    function showQuestion() {
        const optionsContainer = document.getElementById('options-container');
        if (!optionsContainer) return; 
        optionsContainer.innerHTML = '';
        const navBtn = document.getElementById('back-nav-btn');

        if (currentIdx === 0) { navBtn.innerText = "← 返回封面"; } 
        else { navBtn.innerText = "← 回到上一題"; }

        if (currentIdx < questions.length) {
            document.getElementById('progress-text').innerText = `PHASE 2: 負能量提煉中 | 問題 ${currentIdx + 1} / 10`;
            const currentQ = questions[currentIdx];
            document.getElementById('question-text').innerText = currentQ.q;

            currentQ.a.forEach((option, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = option;
                btn.onclick = () => {
                    scoreHistory.push(currentQ.scores[i]);
                    totalScore += currentQ.scores[i];
                    currentIdx++;
                    showQuestion();
                };
                optionsContainer.appendChild(btn);
            });
        } 
        else if (currentIdx === questions.length) {
            document.getElementById('progress-text').innerText = `PHASE 3: 負負得正臨界點 | 最終題`;
            document.getElementById('question-text').innerText = question10.q;

            question10.a.forEach((option, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = option;
                btn.onclick = () => {
                    scoreHistory.push(question10.scores[i]);
                    totalScore += question10.scores[i];
                    currentIdx++;
                    showResult();
                };
                optionsContainer.appendChild(btn);
            });
        }
    }

    function handleBackNavigation() {
        if (currentIdx === 0) {
            window.location.href = "./cover.html";
        } else {
            currentIdx--;
            const lastAddedScore = scoreHistory.pop();
            totalScore -= lastAddedScore;
            showQuestion();
        }
    }

    function showResult() {
        document.getElementById('quiz-page').style.display = 'none';
        document.getElementById('result-page').style.display = 'block';

        let color = "white"; let charName = ""; let quote = "";

        if (totalScore >= 71) { color = "red"; charName = "大同電鍋"; quote = "「心裡一把火,飯都熟了。今天誰敢惹我,我就送他去『大同』世界。」"; }
        else if (totalScore >= 62) { color = "yellow"; charName = "垃圾車"; quote = "「大腦塞滿垃圾資訊,逼逼逼!好想把自己跟著垃圾車一起載走...」"; }
        else if (totalScore >= 53) { color = "blue"; charName = "藍白拖"; quote = "「今天真的是Monday Blue,真的什麼事都想『拖』啊『拖』...」"; }
        else if (totalScore >= 44) { color = "green"; charName = "茄紙袋"; quote = "「凡事追求和平、green(原諒)對方...再壓抑下去,我遲早變綠色郵筒被塞爆。」"; }
        else if (totalScore >= 35) { color = "purple"; charName = "九份芋頭"; quote = "「生活就像夜市的芋圓,看起來Q彈,心裡其實全是一顆顆沉重的『內耗』,真讓人『芋』哭無淚。」"; }
        else if (totalScore >= 26) { color = "orange"; charName = "中秋月餅/蛋黃酥"; quote = "「天天被迫營業、面帶微笑。我的心早就跟月餅裡的蛋黃一樣,被生活給烤乾了。」"; }
        else if (totalScore >= 20) { color = "black"; charName = "夜市豬血糕"; quote = "「靈魂已經被生活揉躪得像豬血糕一樣。別跟我談夢想,老子現在只想『躺平』。」"; }
        else { color = "white"; charName = "小籠包/包子/肉圓"; quote = "「四大皆空,徹底麻木。老子的熱情已經被生活給『蒸』發了,現在只想當個薪水小偷。」"; }

        detectedColor = color; 

        document.getElementById('char-name').innerText = charName;
        document.getElementById('quote-text').innerText = quote;

        startTrackingAR(color);
    }

   function goToCharacterPage() {
        // 1. 強制關閉相機追蹤
        if (camera) { 
            try { camera.stop(); } catch(e) { console.log(e); }
        }
        
        // 2. 徹底斬斷背景的 requestAnimationFrame 動畫迴圈
        if (animationFrameId) { 
            cancelAnimationFrame(animationFrameId); 
            animationFrameId = null; 
        }
        
        // 3. 🌟 終極大絕招：直接把這兩張 3000px 的巨圖從 DOM 網頁結構中「徹底刪除（拔掉）」！
        // 這樣網頁上就絕對不會留下任何隱形障礙物，按鈕保證能按！
        const lImg = document.getElementById('left-eye-img');
        const rImg = document.getElementById('right-eye-img');
        if (lImg) { lImg.remove(); }
        if (rImg) { rImg.remove(); }

        // 4. 切換 HTML 分頁顯示
        document.getElementById('result-page').style.display = 'none';
        document.getElementById('character-page').style.display = 'block';
        
        // 5. 渲染最後一頁的角色大圖與文字內容
        const charImgElement = document.getElementById('final-char-img');
        if (charImgElement) {
            charImgElement.src = characterImages[detectedColor];
        }
        
        const originalCharName = document.getElementById('char-name').innerText;
        const originalQuote = document.getElementById('quote-text').innerText;
        
        document.getElementById('char-page-title').innerText = `核心化身：${originalCharName}`;
        document.getElementById('quote-text-final').innerText = originalQuote;
    }

    // 🌟 配合物理毀滅，重新回收時要把標籤重建回來
    function resetQuizToCover() {
        totalScore = 0;
        currentIdx = 0;
        scoreHistory = [];

        // 🌟 因為剛剛把 left-eye-img 和 right-eye-img 刪掉了，我們要在回到封面時把它們重新建回來
        // 這樣下一位使用者測試時，才會有圖片可以長大
        const resultPage = document.getElementById('result-page');
        if (resultPage && !document.getElementById('left-eye-img')) {
            const newLeft = document.createElement('img');
            newLeft.id = 'left-eye-img';
            newLeft.className = 'eye-grow-img';
            newLeft.alt = '左眼貼圖';
            resultPage.appendChild(newLeft);

            const newRight = document.createElement('img');
            newRight.id = 'right-eye-img';
            newRight.className = 'eye-grow-img';
            newRight.alt = '右眼貼圖';
            resultPage.appendChild(newRight);
        }

        window.location.href = "./cover.html";
    }
    window.addEventListener("DOMContentLoaded", initAiCore);
</script>
</body>
</html>
