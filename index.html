<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>眼前的黑不是黑</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* 防止貼圖滿出網頁時出現瀏覽器捲軸 */
        }
        
        .container {
            background-color: #141414;
            padding: 30px; 
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            max-width: 850px; 
            width: 92%;      
            text-align: center;
            border: 1px solid #222;
            position: relative;
            box-sizing: border-box;
        }
        
        h2 { margin-bottom: 25px; color: #ffdd67; font-size: 26px; }
        .progress { font-size: 14px; color: #666; margin-bottom: 15px; }
        .question-title { font-size: 20px; margin-bottom: 25px; line-height: 1.4; color: #e0e0e0; }
        
        .btn {
            display: block;
            width: 100%;
            padding: 18px 20px;
            margin: 12px 0;
            background-color: #1c1c1c;
            color: #ddd;
            border: 2px solid #2c2c2c;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .btn:hover { 
            background-color: #252525; 
            border-color: #ffdd67; 
            color: #fff;
        }

        .nav-actions {
            margin-top: 25px;
            border-top: 1px solid #222;
            padding-top: 15px;
        }
        .back-btn {
            background: transparent;
            color: #666;
            border: 1px solid #333;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .back-btn:hover {
            color: #ffdd67;
            border-color: #ffdd67;
            background-color: rgba(255, 221, 103, 0.05);
        }

        .restart-btn {
            background-color: transparent;
            color: #ffdd67;
            border: 2px solid #ffdd67;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 221, 103, 0.1);
           position: relative !important;
            z-index: 99999 !important; 
            pointer-events: auto !important;
        }
        .restart-btn:hover {
            background-color: #ffdd67;
            color: #000000;
            box-shadow: 0 0 25px #ffdd67;
        }

        .restart-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            border-color: #555;
            color: #999;
            box-shadow: none;
        }

        .restart-btn:disabled:hover {
            background-color: transparent;
            color: #999;
            box-shadow: none;
        }

        #result-page { display: none; }
        
        #result-page #tracking-container {
            margin-top: 0px !important;
            width: 100%;
            position: relative;
        }
        #result-page #output_canvas {
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
            border-radius: 16px;
            border: none !important;
        }
        #result-page .restart-btn {
            display: inline-block !important;
            margin-top: 25px !important;
            width: auto !important;
        }

        /* 絕對定位的左右雙眼大圖：使其能打破相機外框、飛到網頁範圍內放大 */
        .eye-grow-img {
            position: fixed; 
            z-index: 9998; 
            transform: translate(-50%, -50%); 
            width: 0px; 
            height: auto;
            pointer-events: none; /* 讓滑鼠可以穿透貼圖 */
            display: none; /* 預設完全隱藏，防止載入時穿幫 */
            opacity: 0;
            transition: opacity 2s ease;
        }

        /* 3. 獨立的角色結果分頁樣式 */
        #preview-page {
            display: none;
            text-align: center;
            padding: 10px 0;
        }

        #preview-page #tracking-container {
            margin-top: 0px !important;
            width: 100%;
            position: relative;
        }

        #preview-page #preview-photo-img {
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
            border-radius: 16px;
            border: none !important;
        }

        #preview-page .preview-copy {
            color: #e0e0e0;
            font-size: 16px;
            line-height: 1.6;
            max-width: 80%;
            margin: 0 auto 20px;
        }

        #preview-page .preview-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        #preview-page .restart-btn {
            display: inline-block !important;
            margin-top: 0 !important;
            width: auto !important;
        }

        #character-page,
        #photo-result-page {
            display: none; 
            text-align: center;
            padding: 10px 0;
        }

        .display-character-img,
        .display-photo-result-img {
            width: 100%;
            height: auto;
            margin: 0;
            display: block;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            object-fit: contain;
        }

        .result-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .result-actions .restart-btn {
            display: inline-block !important;
            margin-top: 0 !important;
            width: auto !important;
        }

        .photo-result-shell {
            width: min(100%, 1180px);
            min-height: 78vh;
            display: grid;
            grid-template-columns: minmax(320px, 1.1fr) minmax(280px, 0.9fr);
            gap: 24px;
            align-items: center;
        }

        .result-media-column,
        .result-info-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
            justify-content: center;
        }

        .result-media-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid #222;
            border-radius: 22px;
            padding: 12px;
        }

        .result-media-card img {
            max-height: 36vh;
        }

        #photo-page-title {
            margin: 0;
            text-align: left;
        }

        #photo-quote-text {
            color: #e0e0e0;
            font-style: italic;
            margin: 0;
            font-size: 16px;
            line-height: 1.6;
            text-align: left;
        }

        .qr-section {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        #qr-code-container {
            width: 180px;
            height: 180px;
            padding: 12px;
            background: #ffffff;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .qr-copy {
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.6;
            max-width: 90%;
            margin: 0;
            text-align: left;
        }

        #ai-loading-mask {
            position: absolute; top:0; left:0; width:100%; height:100%; 
            background: #141414; z-index: 1000; 
            display: flex; justify-content: center; align-items: center; 
            border-radius: 24px; flex-direction: column;
        }

        @media (max-width: 900px) {
            .photo-result-shell {
                grid-template-columns: 1fr;
            }

            .result-media-card img {
                max-height: none;
            }

            .result-actions,
            .qr-section {
                justify-content: center;
                align-items: center;
            }

            #photo-page-title,
            #photo-quote-text,
            .qr-copy {
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="ai-loading-mask">
        <div style="font-size: 24px; color: #ffdd67; margin-bottom: 20px; font-weight: bold;">深夜煉金術指標載入中...</div>
        <div style="font-size: 14px; color: #666;">（正在連結 AI 核心，請稍候）</div>
    </div>

    <div id="quiz-page">
        <div class="progress" id="progress-text">LOADING...</div>
        <div class="question-title" id="question-text">準備進入黑眼圈回收程序...</div>
        <div id="options-container"></div>
        
        <div class="nav-actions">
            <button id="back-nav-btn" class="back-btn" onclick="handleBackNavigation()">← 返回封面</button>
        </div>
    </div>

    <div id="result-page">
        <div id="tracking-container">
            <video id="webcam" autoplay playsinline style="display:none;" width="640" height="480"></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>
        
        <img id="left-eye-img" src="" alt="左眼貼圖" class="eye-grow-img">
        <img id="right-eye-img" src="" alt="右眼貼圖" class="eye-grow-img">
        
        <div style="display: none;">
            <div id="char-name"></div>
            <div id="quote-text"></div>
        </div>
        
        <button id="camera-action-btn" class="restart-btn" onclick="goToPhotoPreview()" disabled>黑眼圈IP生成中...</button>
    </div>

    <div id="preview-page">
        <div id="tracking-container">
            <img id="preview-photo-img" src="" alt="拍照預覽">
        </div>
        <div class="preview-actions">
            <button class="restart-btn" onclick="retakePhoto()">重新拍照</button>
            <button class="restart-btn" onclick="goToCharacterPage()">確認</button>
        </div>
    </div>

    <div id="character-page">
        <h2 id="char-page-title" style="color: #ffdd67; margin-bottom: 5px;">核心化身：</h2>
        <img id="final-char-img" src="" alt="角色插圖" class="display-character-img">
        <p id="quote-text-final" style="color: #e0e0e0; font-style: italic; margin: 15px auto; font-size: 16px; line-height: 1.5; max-width: 80%;"></p>
        <div class="result-actions">
            <button class="restart-btn" onclick="saveCurrentResult()">儲存結果</button>
        </div>
    </div>

    <div id="photo-result-page">
        <div class="photo-result-shell">
            <div class="result-media-column">
                <h2 id="photo-page-title" style="color: #ffdd67; margin: 0;">核心化身：</h2>
                <div class="result-media-card">
                    <img id="photo-result-char-img" src="" alt="角色插圖" class="display-character-img">
                </div>
                <div class="result-media-card">
                    <img id="photo-result-photo-img" src="" alt="拍照結果" class="display-photo-result-img">
                </div>
            </div>
            <div class="result-info-column">
                <p id="photo-quote-text"></p>
                <div class="qr-section">
                    <div id="qr-code-container"></div>
                    <p class="qr-copy">掃描此 QR 碼可直接重新開啟目前的結果頁；若要保存圖片，請點擊「儲存結果」下載 PNG/JPG。</p>
                </div>
                <div class="result-actions">
                    <button class="restart-btn" onclick="saveCurrentResult()">儲存結果</button>
                </div>
                <div class="result-actions">
                    <button class="restart-btn" onclick="resetQuizToCover()">重新回收 / 下一位</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let faceMesh;
    let camera;
    let videoElement;
    let canvasElement;
    let canvasCtx;
    let currentFinalColor = 'white'; 
    let loadedImages = {};           
    let detectedColor = 'white'; 
    let capturedPhotoDataUrl = '';
    let qrCodeInstance = null;

    // 時間控速與延遲動畫變數
    let currentEyeWidth = 70;   
    const maxEyeWidth = 3200;   
    const growSpeedPerSecond = 180; 

    let hasLockedCoordinates = false; 
    let animationFrameId = null;
    let lastTimestamp = 0; 
    let startTime = 0; // 紀錄進入結果頁的起始時間點
    let isShrinking = false;
    let shrinkStartTimestamp = 0;
    let hasCompletedSequence = false;

    // 儲存網頁上的絕對座標
    let eyePositions = { lx: 0, ly: 0, rx: 0, ry: 0 };

    // 🌟 修正路徑：確保最後一頁的大圖連結到正確的角色精緻大圖檔名，不與眼圈 pattern 混淆
    const characterImages = {
       red:    './images/pattern_red.png',    
        orange: './images/pattern_orange.png', 
        yellow: './images/pattern_yellow.png',
        green:  './images/pattern_green.png',
        blue:   './images/pattern_blue.png',
        purple: './images/pattern_purple.png',
        black:  './images/pattern_black.png',  
        white:  './images/pattern_white.png'   
    };

    const colorPatternsBase = {
        red:    './images/pattern_red.png',
        orange: './images/pattern_orange.png',
        yellow: './images/pattern_yellow.png',
        green:  './images/pattern_green.png',
        blue:   './images/pattern_blue.png',
        purple: './images/pattern_purple.png',
        black:  './images/pattern_black.png',
        white:  './images/pattern_white.png'
    };

    // 眼周黑眼圈專用左右貼圖對應（起始動畫左右各自不同）
    const colorPatternsLeft = {
        red:    './images/pattern_red_L.png',
        orange: './images/pattern_orange_L.png',
        yellow: './images/pattern_yellow_L.png',
        green:  './images/pattern_green_L.png',
        blue:   './images/pattern_blue_L.png',
        purple: './images/pattern_purple_L.png',
        black:  './images/pattern_black_L.png',
        white:  './images/pattern_white_L.png'
    };

    const colorPatternsRight = {
        red:    './images/pattern_red_R.png',
        orange: './images/pattern_orange_R.png',
        yellow: './images/pattern_yellow_R.png',
        green:  './images/pattern_green_R.png',
        blue:   './images/pattern_blue_R.png',
        purple: './images/pattern_purple_R.png',
        black:  './images/pattern_black_R.png',
        white:  './images/pattern_white_R.png'
    };

    const colorPatternsAltLeft = {
        red:    './images/pattern_red_L.png',
        orange: './images/pattern_orange_L.png',
        yellow: './images/pattern_yellow_L.png',
        green:  './images/pattern_green_L.png',
        blue:   './images/pattern_blue_L.png',
        purple: './images/pattern_purple_L.png',
        black:  './images/pattern_black_L.png',
        white:  './images/pattern_white_L.png'
    };

    const colorPatternsAltRight = {
        red:    './images/pattern_red_R.png',
        orange: './images/pattern_orange_R.png',
        yellow: './images/pattern_yellow_R.png',
        green:  './images/pattern_green_R.png',
        blue:   './images/pattern_blue_R.png',
        purple: './images/pattern_purple_R.png',
        black:  './images/pattern_black_R.png',
        white:  './images/pattern_white_R.png'
    };

    function initAiCore() {
        videoElement = document.getElementById("webcam");
        canvasElement = document.getElementById("output_canvas");
        canvasCtx = canvasElement.getContext("2d");

        Object.keys(colorPatternsLeft).forEach(color => {
            const img = new Image();
            img.src = colorPatternsLeft[color];
            loadedImages[`${color}_L`] = img;
        });

        Object.keys(colorPatternsRight).forEach(color => {
            const img = new Image();
            img.src = colorPatternsRight[color];
            loadedImages[`${color}_R`] = img;
        });

        Object.keys(colorPatternsAltLeft).forEach(color => {
            const img = new Image();
            img.src = colorPatternsAltLeft[color];
            loadedImages[`${color}_2_L`] = img;
        });

        Object.keys(colorPatternsAltRight).forEach(color => {
            const img = new Image();
            img.src = colorPatternsAltRight[color];
            loadedImages[`${color}_2_R`] = img;
        });

        Object.keys(colorPatternsBase).forEach(color => {
            const img = new Image();
            img.src = colorPatternsBase[color];
            loadedImages[color] = img;
        });

        const FaceMeshClass = window.FaceMesh || FaceMesh;
        faceMesh = new FaceMeshClass({
            locateFile: (file) => `https://unpkg.com/@mediapipe/face_mesh@0.4/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true, 
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onFaceResults);
        document.getElementById("ai-loading-mask").style.display = "none";
        showQuestion();
    }

    function updateCameraActionButtonState(isReady, label = '拍照') {
        const cameraActionBtn = document.getElementById('camera-action-btn');
        if (!cameraActionBtn) return;

        cameraActionBtn.disabled = !isReady;
        cameraActionBtn.innerText = label;
    }

    function startTrackingAR(finalColor) {
        currentFinalColor = finalColor;
        currentEyeWidth = 70; 
        hasLockedCoordinates = false; 
        isShrinking = false;
        shrinkStartTimestamp = 0;
        hasCompletedSequence = false;
        capturedPhotoDataUrl = '';
        updateCameraActionButtonState(false, '黑眼圈IP生成中...');
        
        const now = performance.now();
        lastTimestamp = now; 
        startTime = now; 

        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
        }

        const lImg = document.getElementById('left-eye-img');
        const rImg = document.getElementById('right-eye-img');
        lImg.src = colorPatternsLeft[finalColor];
        rImg.src = colorPatternsRight[finalColor];
        lImg.style.width = '70px';
        rImg.style.width = '70px';
        lImg.style.opacity = '0';
        rImg.style.opacity = '0';
        
        // 🌟 修正：一開始初始化時，圖片維持隱藏，防左下角破圖穿幫
        lImg.style.display = 'none';
        rImg.style.display = 'none';

        document.getElementById("tracking-container").style.display = "block";

        if (!camera) {
            const CameraClass = window.Camera || Camera;
            camera = new CameraClass(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            camera.start().catch(err => {
                alert("鏡頭啟動失敗：" + err);
            });
        }

        animateImageGrowth(performance.now());
    }

    // 鎖定時間差與 5 秒延遲的動畫常駐迴圈
    function animateImageGrowth(currentTimestamp) {
        const deltaTime = (currentTimestamp - lastTimestamp) / 1000;
        lastTimestamp = currentTimestamp;

        const timeElapsed = currentTimestamp - startTime;

        const lImg = document.getElementById('left-eye-img');
        const rImg = document.getElementById('right-eye-img');

        // 1.5 秒等待、2.5 秒淡入、2 秒停頓後才開始放大
        const fadeDuration = 2500;
        const pauseDuration = 2000;
        const shrinkDuration = 1200;
        const initialWaitDuration = 1500;

        // 🌟 修正：只有在 1.5 秒待滿、且 AI 已經成功抓到人臉座標鎖定時，才解除隱藏並開始淡入，淡入完成後再停頓幾秒，最後才放大。
        if (timeElapsed >= initialWaitDuration && hasLockedCoordinates) {
            lImg.style.display = 'block';
            rImg.style.display = 'block';

            const fadeElapsed = timeElapsed - initialWaitDuration;
            const fadeProgress = Math.min(fadeElapsed / fadeDuration, 1);

            if (fadeProgress < 1) {
                lImg.style.opacity = String(fadeProgress);
                rImg.style.opacity = String(fadeProgress);
                currentEyeWidth = 70;
            } else if (fadeElapsed < fadeDuration + pauseDuration) {
                lImg.style.opacity = '1';
                rImg.style.opacity = '1';
                currentEyeWidth = 70;
            } else if (hasCompletedSequence) {
                lImg.style.opacity = '1';
                rImg.style.opacity = '1';
                currentEyeWidth = 70;
                updateCameraActionButtonState(true, '拍照');
            } else if (isShrinking) {
                lImg.style.opacity = '1';
                rImg.style.opacity = '1';

                const shrinkProgress = Math.min((currentTimestamp - shrinkStartTimestamp) / shrinkDuration, 1);
                const shrinkRatio = 1 - shrinkProgress;
                currentEyeWidth = maxEyeWidth - (maxEyeWidth - 70) * shrinkProgress;

                if (shrinkProgress >= 1) {
                    currentEyeWidth = 70;
                    isShrinking = false;
                    hasCompletedSequence = true;
                    lImg.src = colorPatternsBase[currentFinalColor];
                    rImg.src = colorPatternsBase[currentFinalColor];
                    updateCameraActionButtonState(true, '拍照');
                }
            } else {
                lImg.style.opacity = '1';
                rImg.style.opacity = '1';

                const growProgress = Math.min((currentTimestamp - (startTime + initialWaitDuration + fadeDuration + pauseDuration)) / shrinkDuration, 1);
                currentEyeWidth = 70 + (maxEyeWidth - 70) * growProgress;

                if (growProgress >= 1) {
                    currentEyeWidth = maxEyeWidth;
                    lImg.src = colorPatternsAltLeft[currentFinalColor];
                    rImg.src = colorPatternsAltRight[currentFinalColor];
                    isShrinking = true;
                    shrinkStartTimestamp = currentTimestamp;
                }
            }
        } else {
            currentEyeWidth = 70;
            lImg.style.display = 'none';
            rImg.style.display = 'none';
            lImg.style.opacity = '0';
            rImg.style.opacity = '0';
        }

        lImg.style.width = currentEyeWidth + 'px';
        rImg.style.width = currentEyeWidth + 'px';
        
        if (hasLockedCoordinates) {
            const inwardShift = Math.min(currentEyeWidth * -0.5, 100);
            lImg.style.left = eyePositions.lx + inwardShift + 'px';
            lImg.style.top = eyePositions.ly + 'px';
            rImg.style.left = eyePositions.rx - inwardShift + 'px';
            rImg.style.top = eyePositions.ry + 'px';
        }

        animationFrameId = requestAnimationFrame(animateImageGrowth);
    }

    function onFaceResults(results) {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        // 鏡像翻轉
        canvasCtx.translate(canvasElement.width, 0);
        canvasCtx.scale(-1, 1);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            const landmarks = results.multiFaceLandmarks[0];
            const rect = canvasElement.getBoundingClientRect();

            // 精算左右兩眼在螢幕上的位置
            eyePositions.lx = rect.left + (1 - landmarks[111].x) * rect.width; 
            eyePositions.ly = rect.top + landmarks[111].y * rect.height;
            eyePositions.rx = rect.left + (1 - landmarks[340].x) * rect.width;
            eyePositions.ry = rect.top + landmarks[340].y * rect.height;

            hasLockedCoordinates = true; 
        }
        canvasCtx.restore();
    }

    // --- 心理問答邏輯 ---

    function showQuestion() {
        const optionsContainer = document.getElementById('options-container');
        if (!optionsContainer) return; 
        optionsContainer.innerHTML = '';
        const navBtn = document.getElementById('back-nav-btn');

        if (currentIdx === 0) { navBtn.innerText = "← 返回封面"; } 
        else { navBtn.innerText = "← 回到上一題"; }

        if (currentIdx < questions.length) {
            document.getElementById('progress-text').innerText = `PHASE 2: 負能量提煉中 | 問題 ${currentIdx + 1} / 10`;
            const currentQ = questions[currentIdx];
            document.getElementById('question-text').innerText = currentQ.q;

            currentQ.a.forEach((option, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = option;
                btn.onclick = () => {
                    scoreHistory.push(currentQ.scores[i]);
                    totalScore += currentQ.scores[i];
                    currentIdx++;

                };
                optionsContainer.appendChild(btn);
            });
        } 
        else if (currentIdx === questions.length) {
            document.getElementById('progress-text').innerText = `PHASE 3: 負負得正臨界點 | 最終題`;
            document.getElementById('question-text').innerText = question10.q;

            question10.a.forEach((option, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = option;
                btn.onclick = () => {
                    scoreHistory.push(question10.scores[i]);
                    totalScore += question10.scores[i];
                    currentIdx++;
                    showResult();
                };
                optionsContainer.appendChild(btn);
            });
        }

    function handleBackNavigation() {
        if (currentIdx === 0) {
            window.location.href = "./cover.html";
        } else {
            currentIdx--;
            const lastAddedScore = scoreHistory.pop();
            totalScore -= lastAddedScore;
            showQuestion();
        }

        if (totalScore >= 71) { color = "red"; charName = "大同電鍋"; quote = "「心裡一把火,飯都熟了。今天誰敢惹我,我就送他去『大同』世界。」"; }

        else if (totalScore >= 53) { color = "blue"; charName = "藍白拖"; quote = "「今天真的是Monday Blue,真的什麼事都想『拖』啊『拖』...」"; }

        else if (totalScore >= 35) { color = "purple"; charName = "九份芋頭"; quote = "「生活就像夜市的芋圓,看起來Q彈,心裡其實全是一顆顆沉重的『內耗』,真讓人『芋』哭無淚。」"; }
        else if (totalScore >= 26) { color = "orange"; charName = "中秋月餅/蛋黃酥"; quote = "「天天被迫營業、面帶微笑。我的心早就跟月餅裡的蛋黃一樣,被生活給烤乾了。」"; }

        else { color = "white"; charName = "小籠包/包子/肉圓"; quote = "「四大皆空,徹底麻木。老子的熱情已經被生活給『蒸』發了,現在只想當個薪水小偷。」"; }

        startTrackingAR(color);
    }

    function captureCurrentFrame() {
        if (!canvasElement) {
            return '';
        }

        try {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvasElement.width;
            tempCanvas.height = canvasElement.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvasElement, 0, 0, tempCanvas.width, tempCanvas.height);

            const lImg = document.getElementById('left-eye-img');
            const rImg = document.getElementById('right-eye-img');
            const rect = canvasElement.getBoundingClientRect();

            const drawOverlay = (imgElement) => {
                if (!imgElement || !imgElement.src || imgElement.style.display === 'none' || imgElement.style.opacity === '0') {
                    return;
                }

                const scaledWidth = parseFloat(imgElement.style.width || '0');
                if (!scaledWidth) {
                    return;
                }

                const aspect = imgElement.naturalHeight / imgElement.naturalWidth;
                const drawWidth = scaledWidth;
                const drawHeight = scaledWidth * aspect;

                const sourceX = (imgElement === lImg ? eyePositions.lx : eyePositions.rx) - rect.left;
                const sourceY = (imgElement === lImg ? eyePositions.ly : eyePositions.ry) - rect.top;
                const canvasX = sourceX * (canvasElement.width / rect.width);
                const canvasY = sourceY * (canvasElement.height / rect.height);

                tempCtx.drawImage(
                    imgElement,
                    canvasX - drawWidth / 2,
                    canvasY - drawHeight / 2,
                    drawWidth,
                    drawHeight
                );
            };

            drawOverlay(lImg);
            drawOverlay(rImg);

            return tempCanvas.toDataURL('image/png');
        } catch (error) {
            console.error('拍照失敗：', error);
            return '';
        }
    }

    function showPreviewPage() {

        document.getElementById('preview-page').style.display = 'none';
        document.getElementById('character-page').style.display = 'block';
        document.getElementById('photo-result-page').style.display = 'none';

        const charImgElement = document.getElementById('final-char-img');
        const resultImage = characterImages[currentFinalColor] || characterImages[detectedColor];

    function persistCurrentResultState() {
        const shareId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        const state = {
            charName: document.getElementById('char-name').innerText || '未知角色',
            quote: document.getElementById('quote-text').innerText || '',
            color: currentFinalColor,
            photoDataUrl: capturedPhotoDataUrl || '',
            timestamp: Date.now()
        };

        localStorage.setItem(`midnight-alchemy-share-${shareId}`, JSON.stringify(state));
        return shareId;
    }

    function renderQrCode(text) {
        const container = document.getElementById('qr-code-container');
        if (!container) {
            return;
        }

        container.innerHTML = '';

        if (!window.QRCode) {
            container.innerText = 'QR 碼載入失敗';
            return;
        }

        qrCodeInstance = new QRCode(container, {
            text,
            width: 156,
            height: 156,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
        });
    }

    async function exportCurrentPageImage() {
        if (!window.html2canvas) {
            throw new Error('html2canvas 未載入');
        }

        const target = document.getElementById('photo-result-page');
        if (!target) {
            throw new Error('找不到 photo-result-page');
        }

        const canvas = await html2canvas(target, {
            backgroundColor: '#141414',
            scale: 1,
            width: 900,
            height: 720,
            useCORS: true,
            logging: false
        });

        return canvas.toDataURL('image/jpeg', 0.85);
    }

    async function refreshQrCode() {
        try {
            const shareId = persistCurrentResultState();
            const baseUrl = window.location.href.split(/[?#]/)[0];
            const shareUrl = `${baseUrl}?share=${encodeURIComponent(shareId)}`;
            renderQrCode(shareUrl);
        } catch (error) {
            console.error('產生 QR 分享連結失敗：', error);
            renderQrCode('無法產生分享連結');
        }
    }

    async function downloadCurrentPageImage() {
        const imageDataUrl = await exportCurrentPageImage();
        const link = document.createElement('a');
        link.href = imageDataUrl;
        link.download = '當前視窗結果.jpg';
        document.body.appendChild(link);
        link.click();
        link.remove();
    }

    function applySharedState(state) {
        if (!state) {
            return;
        }

        detectedColor = state.color || detectedColor;
        currentFinalColor = state.color || currentFinalColor;

        document.getElementById('char-name').innerText = state.charName || '未知角色';
        document.getElementById('quote-text').innerText = state.quote || '';
        capturedPhotoDataUrl = state.photoDataUrl || '';
        goToPhotoResultPage();
    }

        document.getElementById('result-page').style.display = 'none';
        document.getElementById('preview-page').style.display = 'none';
        document.getElementById('character-page').style.display = 'none';
        document.getElementById('photo-result-page').style.display = 'block';

        if (charImgElement) {
            charImgElement.src = resultImage;
            charImgElement.alt = '角色插圖';
        }

        if (photoImgElement) {
            photoImgElement.src = capturedPhotoDataUrl || '';
            photoImgElement.alt = '拍照結果';

    function restoreReadyToCaptureState() {
        ensureResultEyeImages();

        const lImg = document.getElementById('left-eye-img');
        const rImg = document.getElementById('right-eye-img');

        lImg.src = colorPatternsBase[currentFinalColor];
        rImg.src = colorPatternsBase[currentFinalColor];
                lImg.style.display = 'block';
                rImg.style.display = 'block';
                lImg.style.opacity = '1';
                rImg.style.opacity = '1';
                currentEyeWidth = 70;
        lImg.style.width = '70px';
        rImg.style.width = '70px';

        isShrinking = false;
        shrinkStartTimestamp = 0;
        hasCompletedSequence = true;

        startTime = performance.now() - 7000;
        lastTimestamp = performance.now();

        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }

        animationFrameId = requestAnimationFrame(animateImageGrowth);
    }

    function retakePhoto() {
        document.getElementById('preview-page').style.display = 'none';
        document.getElementById('result-page').style.display = 'block';
        document.getElementById('character-page').style.display = 'none';
        document.getElementById('photo-result-page').style.display = 'none';
        capturedPhotoDataUrl = '';
        updateCameraActionButtonState(true, '拍照');

        if (!camera) {
            const CameraClass = window.Camera || Camera;
            camera = new CameraClass(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
        }

        try {
            camera.start();
        } catch (error) {
            console.error('重新啟動鏡頭失敗：', error);
        }

        restoreReadyToCaptureState();
    }

        const cameraActionBtn = document.getElementById('camera-action-btn');
        if (cameraActionBtn && cameraActionBtn.disabled) {
            return;
        }

        capturedPhotoDataUrl = captureCurrentFrame();

        if (camera) { 
            try { camera.stop(); } catch(e) { console.log(e); }
        }

        if (animationFrameId) {

            animationFrameId = null;

    window.addEventListener("DOMContentLoaded", () => {

        const params = new URLSearchParams(window.location.search);
